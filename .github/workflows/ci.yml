# Runs on every push and pull request: unit, database, API and browser tests, then a build.
# A pull request into main can only be merged when this is green (set that up in
# GitHub → Settings → Branches → Branch protection, see docs/ENVIRONMENTS.md).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Unit tests (encryption, signatures, validation)
        run: npm test
      - name: Database tests (stock, reservations, reminders, permissions)
        run: npm run test:sql
        env:
          PGDATABASE: knotily_test
      - name: API tests (accounts, checkout, Razorpay verification, owner, export)
        run: npm run test:api
        env:
          PGDATABASE: knotily_test
      - name: Browser tests (shopper + owner journeys)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          PGDATABASE: knotily_e2e
      - name: Build
        run: npm run build
        
