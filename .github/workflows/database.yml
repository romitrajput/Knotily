# Applies new database migrations (supabase/migrations) to the matching Supabase project:
#   push to develop → Testing project      push to main → Production project
# Vercel deploys the site itself through its Git integration.
# Secrets needed (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN
#   TESTING_PROJECT_REF, TESTING_DB_PASSWORD
#   PRODUCTION_PROJECT_REF, PRODUCTION_DB_PASSWORD
#   TESTING_DB_URL (only for the optional demo seed: Project Settings → Database → Connection string, "Session pooler")
name: Database migrations

on:
  push:
    branches: [develop, main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      seed_testing:
        description: "Load the demo catalogue into the TESTING project (never production)"
        type: boolean
        default: false

concurrency:
  group: db-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ github.ref_name == 'main' && secrets.PRODUCTION_PROJECT_REF || secrets.TESTING_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.PRODUCTION_DB_PASSWORD || secrets.TESTING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Load demo catalogue (Testing only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_testing && github.ref_name != 'main' }}
        env:
          TESTING_DB_URL: ${{ secrets.TESTING_DB_URL }}
        run: psql "$TESTING_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
